[package]
name = "zako"
version = "0.2.0"
edition = "2024"
description = "A lightweight desktop diff viewer for reviewing agent-written code"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11" }
sourceview = { package = "sourceview5", version = "0.11" }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
